<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The LCCB Forums</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1 style="text-align:center;">Login to The LCCB Forums</h1>

    <form id="loginForm" style="text-align:center;">
        <label for="email">Email:</label><br>
        <input type="email" id="email" autocomplete="username" required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password"
               autocomplete="current-password" required>
        <br><br>

        <button type="submit" id="loginButton">Log In</button>
    </form>

    <p id="message" role="status" aria-live="polite"
       style="text-align:center;font-weight:bold;"></p>

    <p style="text-align:center;">
        Don't have an account?
        <a href="register.html">Register here</a>.
    </p>

    <h2 style="text-align:center;color:red;">
        DON'T USE YOUR REAL LCCB PASSWORD
    </h2>

    <script>
        const SUPABASE_URL =
            'https://lcgjbhfoipcipfuppccp.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const button = document.getElementById('loginButton');

        function showMessage(text, color) {
            message.textContent = text;
            message.style.color = color;
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const email =
                document.getElementById('email').value.trim().toLowerCase();

            const password =
                document.getElementById('password').value;

            button.disabled = true;
            showMessage('Logging in...', 'blue');

            try {
                const { data, error } =
                    await client.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    if (error.message.toLowerCase().includes('confirm')) {
                        showMessage(
                            'Please verify your email before logging in.',
                            'red'
                        );
                    } else {
                        showMessage(error.message, 'red');
                    }
                    return;
                }

                if (!data.session) {
                    showMessage(
                        'No active session was created. Please try again.',
                        'red'
                    );
                    return;
                }

                showMessage('Login successful! Opening forums...', 'green');

                window.location.replace('dashboard.html');

            } catch (error) {
                console.error('Login error:', error);

                showMessage(
                    'Connection problem. Check your internet and try again.',
                    'red'
                );
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
