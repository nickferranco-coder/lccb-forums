<html>
    <head>
        <title>Login - The LCCB Forums</title>
        <link rel="stylesheet" href="style.css">
        <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <h1 style="text-align:center;">Login to The LCCB Forums</h1>
        
        <!-- FIXED: Added an inline handler so the script intercepts the submission immediately -->
        <form id="loginForm" onsubmit="handleLoginClick(event)" style="text-align:center;">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>
            
            <input type="submit" value="Log In">
        </form>

        <p id="message" style="text-align:center; font-weight:bold;"></p>
        <p style="text-align:center;">Don't have an account? <a href="register.html">Register here</a>.</p>
        <h1 style="text-align:center; color:red;">DONT USE YOUR REAL LCCB PASSWORD</h1>

        <script>
            const SUPABASE_URL = 'https://lcgjbhfoipcipfuppccp.supabase.co'; 
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';
            
            // FIXED: Renamed this tracking variable so it stops crashing your code
            let supabaseClientInstance = null;

            function getDatabaseClient() {
                if (supabaseClientInstance) return supabaseClientInstance;
                if (window.supabase) {
                    supabaseClientInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    return supabaseClientInstance;
                }
                return null;
            }

            async function handleLoginClick(e) {
                e.preventDefault(); // STOPS THE PAGE FROM RESETTING OR REFRESHING
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const messageEl = document.getElementById('message');

                messageEl.style.color = 'blue';
                messageEl.innerText = "Checking credentials...";

                const client = getDatabaseClient();
                if (!client) {
                    messageEl.style.color = 'red';
                    messageEl.innerText = "Connection loading. Please wait a second and click Log In again.";
                    return;
                }

                const { data, error } = await client.auth.signInWithPassword({ email: email, password: password });

                if (error) {
                    messageEl.style.color = 'red';
                    if (error.message.toLowerCase().includes("confirmed")) {
                        messageEl.innerText = "Please confirm your email link first.";
                    } else {
                        messageEl.innerText = error.message;
                    }
                } else {
                    messageEl.style.color = 'green';
                    messageEl.innerText = "Login successful! Redirecting...";
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
                }
            }
        </script>
    </body>
</html>
