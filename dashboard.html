<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <!-- Load the official Supabase JavaScript Library CDN -->
        <script src="https://jsdelivr.net"></script>
        
        <style>
            /* Layout styling to anchor username details cleanly in the top right corner */
            .top-bar {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                padding: 15px 20px;
                font-family: Arial, sans-serif;
                font-size: 0.95rem;
                gap: 15px;
            }
            .username-accent {
                color: #0066cc; /* Clean accent color for the student username */
                font-weight: bold;
            }
            .logout-btn {
                background-color: #ff4d4d;
                color: white;
                border: none;
                padding: 6px 12px;
                cursor: pointer;
                border-radius: 4px;
                font-weight: bold;
            }
            .logout-btn:hover {
                background-color: #cc0000;
            }
        </style>
    </head>
    <body>
        <!-- Top Right User Navigation Panel -->
        <div class="top-bar">
            Welcome, <span id="username-display" class="username-accent">Loading...</span>!
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>

        <h1 style="text-align:center;">Welcome to the LCCB Forums Dashboard</h1>
        <p style="text-align:center;">This is your dashboard where you can manage your account and access forum features.</p>
        <div style="text-align:center;">
            <button onclick="window.location.href='index.html'" style="text-align: center;">Back to Home</button>
        </div>

        <script>
            // Initialize your Supabase client
            const SUPABASE_URL = 'https://supabase.co'; 
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';
            
            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Page Protection: Automatically look up the active LCCian user session
            async function checkUserSession() {
                const { data: { user }, error } = await supabase.auth.getUser();

                // Security wall: Kick unverified users right back to the login script
                if (error || !user) {
                    window.location.href = 'login.html';
                    return;
                }

                // Extract the profile display_name metadata from registration
                const username = user.user_metadata?.display_name || "LCCian Student";
                
                // Inject the string data safely into the layout container
                document.getElementById('username-display').innerText = username;
            }

            // Cleanly destroy browser cookies and storage sessions on sign-out
            async function handleLogout() {
                await supabase.auth.signOut();
                window.location.href = 'login.html';
            }

            // Initialize the database lookups instantly
            checkUserSession();
        </script>
    </body>
</html>
