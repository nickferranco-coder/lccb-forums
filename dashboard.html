<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        
        <style>
            .top-bar { display: flex; justify-content: flex-end; align-items: center; padding: 15px 20px; font-family: Arial, sans-serif; gap: 15px; }
            .username-accent { color: #0066cc; font-weight: bold; }
            .logout-btn { background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
            .forum-box { max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif; }
            textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #aaa; resize: none; }
            .post-btn { background-color: #008cba; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
            .feed-container { max-width: 600px; margin: 20px auto; font-family: Arial, sans-serif; }
            .post-card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 6px; text-align: left; }
            .post-meta { font-size: 0.85rem; color: #666; margin-bottom: 5px; }
            .post-author { font-weight: bold; color: #0066cc; }
        </style>
    </head>
    <body>
        <div class="top-bar">
            Welcome, <span id="username-display" class="username-accent">Loading...</span>!
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>

        <h1 style="text-align:center;">The LCCB Forums Dashboard</h1>

        <div class="forum-box">
            <h3>Create a Post</h3>
            <form id="postForm">
                <textarea id="postContent" placeholder="Share something with fellow LCCians..." required></textarea>
                <button type="submit" class="post-btn">Publish Post</button>
            </form>
            <p id="postMessage" style="font-weight:bold;"></p>
        </div>

        <div class="feed-container">
            <h3>Recent Student Activity</h3>
            <hr>
            <div id="forumFeed">Loading forum feed...</div>
        </div>

        <script>
            const SUPABASE_URL = 'https://lcgjbhfoipcipfuppccp.supabase.co'; 
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';
            let supabase;
            let currentUser = null;

            // 1. FAST INITIALIZATION: Read from device localStorage cache files immediately
            function checkSessionCached() {
                const hostname = new URL(SUPABASE_URL).hostname;
                const cacheData = localStorage.getItem(`sb-${hostname}-auth-token`);
                
                if (cacheData) {
                    try {
                        const parsed = JSON.parse(cacheData);
                        if (parsed?.user) {
                            currentUser = parsed.user;
                            const username = currentUser.user_metadata?.display_name || "LCCian Student";
                            // Updates the text instantly on screen so there's zero waiting delay
                            document.getElementById('username-display').innerText = username;
                            return true;
                        }
                    } catch (e) { console.error(e); }
                }
                return false;
            }

            // Fire cache injection right away before anything else downloads
            const hasLocalSession = checkSessionCached();
            if (!hasLocalSession && !window.supabase) {
                // If there's no trace of a session at all, route them to login immediately
                window.location.href = 'login.html';
            }

            function initSupabase() {
                if (window.supabase) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    checkUserSessionLive();
                } else {
                    setTimeout(initSupabase, 30);
                }
            }

            // 2. BACKGROUND SECURITY CHECK: Runs quietly in the background without locking the screen
            async function checkUserSessionLive() {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (error || !user) {
                    window.location.href = 'login.html';
                    return;
                }
                currentUser = user;
                const username = user.user_metadata?.display_name || "LCCian Student";
                document.getElementById('username-display').innerText = username;
                
                fetchForumPosts();
                setupFormListener();
            }

            async function fetchForumPosts() {
                const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
                const feedEl = document.getElementById('forumFeed');
                if (error) { feedEl.innerText = "Error: " + error.message; return; }
                if (data.length === 0) { feedEl.innerText = "No posts yet. Start the conversation!"; return; }

                feedEl.innerHTML = '';
                data.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <div class="post-meta">By <span class="post-author">${post.username}</span> on ${new Date(post.created_at).toLocaleString()}</div>
                        <div class="post-body">${post.content}</div>
                    `;
                    feedEl.appendChild(card);
                });
            }

            function setupFormListener() {
                document.getElementById('postForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const content = document.getElementById('postContent').value;
                    const msgEl = document.getElementById('postMessage');
                    const username = currentUser.user_metadata?.display_name || "LCCian Student";

                    msgEl.style.color = 'blue'; msgEl.innerText = "Publishing...";

                    const { error } = await supabase.from('posts').insert([{ content: content, user_id: currentUser.id, username: username }]);

                    if (error) {
                        msgEl.style.color = 'red'; msgEl.innerText = error.message;
                    } else {
                        msgEl.style.color = 'green'; msgEl.innerText = "Post shared!";
                        document.getElementById('postContent').value = '';
                        fetchForumPosts();
                    }
                });
            }

            async function handleLogout() {
                if (supabase) await supabase.auth.signOut();
                window.location.href = 'login.html';
            }

            initSupabase();
        </script>
    </body>
</html>
