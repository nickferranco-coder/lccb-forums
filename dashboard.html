<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The LCCB Forums Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            font-family: Arial, sans-serif;
            gap: 15px;
            flex-wrap: wrap;
        }

        .username-accent {
            color: #0066cc;
            font-weight: bold;
        }

        .logout-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .forum-box, .feed-container {
            max-width: 600px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        .forum-box {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            height: 90px;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #aaa;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        .post-btn {
            background: #008cba;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .post-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .post-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
        }

        .post-author {
            color: #0066cc;
            font-weight: bold;
        }

        .post-body {
            white-space: pre-wrap;
        }

        @media (max-width: 640px) {
            .forum-box, .feed-container {
                margin: 20px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="top-bar">
        Welcome,
        <span id="username-display" class="username-accent">Loading...</span>!

        <button id="logoutButton" class="logout-btn" type="button">
            Log Out
        </button>
    </div>

    <h1 style="text-align:center;">The LCCB Forums Dashboard</h1>

    <div class="forum-box">
        <h3>Create a Post</h3>

        <form id="postForm">
            <textarea id="postContent"
                placeholder="Share something with fellow LCCians..."
                maxlength="2000" required></textarea>

            <button id="publishButton" class="post-btn" type="submit">
                Publish Post
            </button>
        </form>

        <p id="postMessage" role="status" aria-live="polite"></p>
    </div>

    <div class="feed-container">
        <h3>Recent Student Activity</h3>
        <hr>
        <div id="forumFeed">Loading posts...</div>
    </div>

    <script>
        const SUPABASE_URL =
            'https://lcgjbhfoipcipfuppccp.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const usernameDisplay =
            document.getElementById('username-display');

        const forumFeed = document.getElementById('forumFeed');
        const postForm = document.getElementById('postForm');
        const postContent = document.getElementById('postContent');
        const postMessage = document.getElementById('postMessage');
        const publishButton = document.getElementById('publishButton');
        const logoutButton = document.getElementById('logoutButton');

        let currentUser = null;
        let publishing = false;

        function getUsername(user) {
            return user.user_metadata?.display_name || 'LCCian Student';
        }

        function showMessage(element, text, color) {
            element.textContent = text;
            element.style.color = color;
        }

        async function initializeDashboard() {
            try {
                // Read the local session without an initial getUser()
                // network verification request.
                const { data, error } = await client.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    window.location.replace('login.html');
                    return;
                }

                currentUser = data.session.user;

                usernameDisplay.textContent = getUsername(currentUser);

                // Start loading posts without delaying the dashboard.
                fetchForumPosts();

            } catch (error) {
                console.error('Session error:', error);

                showMessage(
                    forumFeed,
                    'Could not check your session. Please try again.',
                    'red'
                );
            }
        }

        async function fetchForumPosts() {
            forumFeed.textContent = 'Loading posts...';

            try {
                const { data, error } = await client
                    .from('posts')
                    .select('id, username, content, created_at')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) {
                    console.error('Feed error:', error);

                    forumFeed.textContent =
                        'Could not load posts. Check your database permissions.';

                    return;
                }

                if (!data || data.length === 0) {
                    forumFeed.textContent =
                        'No posts yet. Start the conversation!';
                    return;
                }

                forumFeed.replaceChildren();

                data.forEach(function(post) {
                    const card = document.createElement('div');
                    card.className = 'post-card';

                    const meta = document.createElement('div');
                    meta.className = 'post-meta';

                    const author = document.createElement('span');
                    author.className = 'post-author';
                    author.textContent = post.username || 'LCCian Student';

                    const date = document.createElement('span');
                    const parsedDate = new Date(post.created_at);

                    date.textContent = Number.isNaN(parsedDate.getTime())
                        ? 'Unknown date'
                        : parsedDate.toLocaleString();

                    meta.append('By ', author, ' on ', date);

                    const content = document.createElement('div');
                    content.className = 'post-body';
                    content.textContent = post.content || '';

                    card.append(meta, content);
                    forumFeed.appendChild(card);
                });

            } catch (error) {
                console.error('Feed error:', error);

                forumFeed.textContent =
                    'Connection error while loading posts.';
            }
        }

        postForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            if (!currentUser || publishing) {
                return;
            }

            const content = postContent.value.trim();

            if (!content) {
                showMessage(postMessage, 'Write something first!', 'red');
                return;
            }

            publishing = true;
            publishButton.disabled = true;

            showMessage(postMessage, 'Publishing...', 'blue');

            try {
                const { error } = await client
                    .from('posts')
                    .insert({
                        content: content,
                        user_id: currentUser.id,
                        username: getUsername(currentUser)
                    });

                if (error) {
                    console.error('Publish error:', error);

                    showMessage(
                        postMessage,
                        'Could not publish. Check your database permissions.',
                        'red'
                    );

                    return;
                }

                postContent.value = '';

                showMessage(postMessage, 'Post shared!', 'green');

                await fetchForumPosts();

            } catch (error) {
                console.error('Publish error:', error);

                showMessage(
                    postMessage,
                    'Connection error. Please try again.',
                    'red'
                );
            } finally {
                publishing = false;
                publishButton.disabled = false;
            }
        });

        logoutButton.addEventListener('click', async function() {
            logoutButton.disabled = true;

            try {
                const { error } = await client.auth.signOut();

                if (error) {
                    console.error('Logout error:', error);

                    showMessage(
                        postMessage,
                        'Could not log out. Please try again.',
                        'red'
                    );

                    logoutButton.disabled = false;
                    return;
                }

                window.location.replace('login.html');

            } catch (error) {
                console.error('Logout error:', error);

                showMessage(
                    postMessage,
                    'Connection error while logging out.',
                    'red'
                );

                logoutButton.disabled = false;
            }
        });

        initializeDashboard();
    </script>
</body>
</html>
