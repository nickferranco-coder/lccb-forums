<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <!-- Load the official Supabase JavaScript Library CDN -->
        <script src="https://jsdelivr.net"></script>
        
        <style>
            .top-bar {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                padding: 15px 20px;
                font-family: Arial, sans-serif;
                font-size: 0.95rem;
                gap: 15px;
            }
            .username-accent {
                color: #0066cc;
                font-weight: bold;
            }
            .logout-btn {
                background-color: #ff4d4d;
                color: white;
                border: none;
                padding: 6px 12px;
                cursor: pointer;
                border-radius: 4px;
                font-weight: bold;
            }
            .logout-btn:hover {
                background-color: #cc0000;
            }
        </style>
    </head>
    <body>
        <div class="top-bar">
            Welcome, <span id="username-display" class="username-accent">Loading...</span>!
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>

        <h1 style="text-align:center;">Welcome to the LCCB Forums Dashboard</h1>
        <p style="text-align:center;">This is your dashboard where you can manage your account and access forum features.</p>
        <div style="text-align:center;">
            <button onclick="window.location.href='index.html'" style="text-align: center;">Back to Home</button>
        </div>

        <script>
            const SUPABASE_URL = 'https://supabase.co'; 
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';
            let supabase;

            // Fast Session Check: Instantly runs from local memory data
            function loadCachedUser() {
                const sessionKey = `sb-${new URL(SUPABASE_URL).hostname}-auth-token`;
                const cachedData = localStorage.getItem(sessionKey);

                if (cachedData) {
                    try {
                        const parsed = JSON.parse(cachedData);
                        const user = parsed?.user;
                        if (user) {
                            const username = user.user_metadata?.display_name || "LCCian Student";
                            document.getElementById('username-display').innerText = username;
                            return true;
                        }
                    } catch (e) {
                        console.error("Cache read error:", e);
                    }
                }
                return false;
            }

            async function checkUserSessionLive() {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (error || !user) {
                    window.location.href = 'login.html';
                    return;
                }
                const username = user.user_metadata?.display_name || "LCCian Student";
                document.getElementById('username-display').innerText = username;
            }

            async function handleLogout() {
                if (supabase) {
                    await supabase.auth.signOut();
                }
                window.location.href = 'login.html';
            }

            // Run rendering immediately from cache
            loadCachedUser();

            // Then safely initialize Supabase network requests in the background
            window.onload = function() {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                checkUserSessionLive();
            };
        </script>
    </body>
</html>
