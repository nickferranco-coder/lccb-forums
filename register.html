<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The LCCB Forums</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1 style="text-align:center;">Register for The LCCB Forums</h1>

    <form id="registerForm" style="text-align:center;">
        <label for="username">Username:</label><br>
        <input type="text" id="username" maxlength="30" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email"
            pattern="[a-zA-Z0-9._%+\-]+@lccbonline\.edu\.ph"
            title="Only @lccbonline.edu.ph emails are allowed."
            required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" minlength="8" required>
        <br><br>

        <button type="submit" id="registerButton">Register</button>
    </form>

    <p id="message" role="status" aria-live="polite"
       style="text-align:center;font-weight:bold;"></p>

    <p style="text-align:center;">
        Already have an account?
        <a href="login.html">Log in here</a>.
    </p>

    <h2 style="text-align:center;color:red;">
        DON'T USE YOUR REAL LCCB PASSWORD
    </h2>

    <script>
        const SUPABASE_URL =
            'https://lcgjbhfoipcipfuppccp.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2piaGZvaXBjaXBmdXBwY2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUwMTgsImV4cCI6MjEwNzIxMTAxOH0.Q1Yutq0Y-wTHUvMzwSEWjAd4C4KgR3Coc2Xk8QpiEUE';

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const button = document.getElementById('registerButton');

        function showMessage(text, color) {
            message.textContent = text;
            message.style.color = color;
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username =
                document.getElementById('username').value.trim();

            const email =
                document.getElementById('email').value.trim().toLowerCase();

            const password =
                document.getElementById('password').value;

            if (!username) {
                showMessage('Please enter a username.', 'red');
                return;
            }

            if (!/^[a-zA-Z0-9._%+-]+@lccbonline\.edu\.ph$/.test(email)) {
                showMessage(
                    'Only @lccbonline.edu.ph emails are allowed.',
                    'red'
                );
                return;
            }

            if (password.length < 8) {
                showMessage(
                    'Your password must be at least 8 characters.',
                    'red'
                );
                return;
            }

            button.disabled = true;
            showMessage('Creating your account...', 'blue');

            try {
                const { data, error } = await client.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            display_name: username
                        }
                    }
                });

                if (error) {
                    showMessage(error.message, 'red');
                    return;
                }

                if (data.session) {
                    showMessage(
                        'Account created! You can now log in.',
                        'green'
                    );
                } else {
                    showMessage(
                        'Registration successful! Check your school email for a verification link.',
                        'green'
                    );
                }

                form.reset();

            } catch (error) {
                console.error('Registration error:', error);

                showMessage(
                    'Connection problem. Check your internet and try again.',
                    'red'
                );
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
